<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider - Guide</title>

    <style>
        body {
            background-color: #7db4fc;
        }

        .spider-man {
            display: inline-block;
            margin-left: 40px;
            padding-top: 40px;
            transform-origin: top center;
            animation: descer 5s ease-in-out infinite;
        }

        @keyframes descer {
            0% {transform: translateY(-600px);}
            30% {transform: translateY(-100px);}
            40% {transform: rotate(10deg) translateY(-100px)}
            50% {transform: rotate(-10deg) translateY(-100px)}
            60% {transform: rotate(10deg) translateY(-100px)}
            70% {transform: rotate(-10deg) translateY(-100px)}
            80% {transform: translateY(-100px);}
            100% {transform: translateY(-600px);}
        }


    </style>
</head>
<body>
    <div class="spider-man">
        <img src="img\foto1.png" alt="Homem aranha" width="500">
    </div>
</body>
</html>
